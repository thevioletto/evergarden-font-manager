name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Node / pnpm ──────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # ── Version guard ────────────────────────────────────────────────────
      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match package.json version v$version"
            exit 1
          }

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build Tauri app (portable)
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage portable binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          Copy-Item "src-tauri/target/release/evergarden-font-manager.exe" "release/Evergarden.Font.Manager.exe"

      # ── Release ──────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/Evergarden.Font.Manager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
